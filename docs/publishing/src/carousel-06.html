<!doctype html>
<html lang="en">
<head>

<title>Ewento Slides — export report</title>
<link rel="stylesheet" href="base.css">
<style>
  .window { left: 820px; top: 198px; }
</style>
</head>
<body>
<div class="canvas">
  <section class="text">
    <span class="kicker"><span class="num">06</span>Export report</span>
    <h1>Know exactly what you&nbsp;got</h1>
    <p class="sub">Every export ends with a report — nothing is silently lost.</p>
    <ul class="points">
      <li>Rasterized layers, with the reason</li>
      <li>Fonts the recipient must install</li>
      <li>Layers skipped outside the slide</li>
      <li>How much the images shrank</li>
    </ul>
  </section>

  <div class="window">
    <div class="bar"><img src="icon.svg" alt=""><span>Ewento Slides</span><i class="x"></i></div>
    <div class="shot" data-shot="report-details"></div>
  </div>


  <footer class="brand"></footer>
</div>
